name: Release — macOS Binary

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Rebuild the binary for an existing tag (e.g. after a runner retirement
  # cancelled the tag-push run). Builds from the tag, never from the branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v2.0.0"
        required: true
        type: string

permissions:
  contents: write

# A dispatch and a tag-push run for the same tag must not race on the release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build, sign, notarize (arm64)
    runs-on: macos-15 # Apple Silicon; macos-14 runners are retired
    timeout-minutes: 45

    env:
      HOMEBREW_PREFIX: /opt/homebrew
      PYTHON_VERSION: "3.11"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          # [[ =~ ]] matches the whole value; grep would pass a multi-line input
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release tag input is not a vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set version from tag
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # libmagic is bundled into the binary; tesseract is a runtime dep (not bundled)
      - name: Install system dependencies
        run: |
          brew update --quiet
          brew install libmagic tesseract create-dmg

      - name: Install Python dependencies (no ML/torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf-light,office,ocr]"
          pip install "pyinstaller==6.11.1"

      - name: Build with PyInstaller
        run: pyinstaller drop2md.spec --clean --noconfirm

      - name: Smoke-test binary
        run: |
          ./dist/drop2md/drop2md --version
          ./dist/drop2md/drop2md --help > /dev/null

      # The oldest macOS the bundle runs on is the highest deployment target
      # of any Mach-O file in it (Homebrew dylibs follow the runner's macOS).
      - name: Measure minimum macOS version
        run: |
          MIN_MACOS=$(find dist/drop2md -type f | while IFS= read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              otool -l "$f" | awk '
                /LC_BUILD_VERSION/      { b = 1 }
                b && $1 == "minos"      { print $2; b = 0 }
                /LC_VERSION_MIN_MACOSX/ { v = 1 }
                v && $1 == "version"    { print $2; v = 0 }'
            fi
          done | sort -V | tail -1)
          if [ -z "$MIN_MACOS" ]; then
            echo "::error::could not read a deployment target from any Mach-O file"
            exit 1
          fi
          echo "Minimum macOS: $MIN_MACOS"
          echo "MIN_MACOS=$MIN_MACOS" >> "$GITHUB_ENV"

      # ── Code signing ──────────────────────────────────────────────────────
      # Required secrets:
      #   APPLE_DEVELOPER_CERT_P12   — base64-encoded .p12 export of your
      #                                "Developer ID Application" certificate
      #   APPLE_DEVELOPER_CERT_PASS  — passphrase used when exporting the .p12
      #   CODESIGN_IDENTITY          — full identity string, e.g.:
      #                                "Developer ID Application: Thomas Juul Dyhr (XXXXXXXXXX)"
      - name: Import code-signing certificate
        env:
          APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          APPLE_DEVELOPER_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERT_PASS }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -hex 20)
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$APPLE_DEVELOPER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_CERT_PASS" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN_PATH"

      - name: Code-sign bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          # Sign ALL Mach-O binaries (not just .so/.dylib — PyInstaller produces
          # extension modules with no extension and copies of the Python interpreter)
          find dist/drop2md -type f | while read -r f; do
            if file "$f" | grep -qE "Mach-O (64-bit )?executable|Mach-O (64-bit )?bundle|Mach-O (64-bit )?dynamically linked shared library"; then
              codesign --force --verify --timestamp \
                --options runtime \
                --entitlements scripts/entitlements.plist \
                --sign "$CODESIGN_IDENTITY" "$f"
            fi
          done
          # Sign the bundle directory last (codesign requires inside-out order;
          # the directory seal is applied after all contents are signed)
          codesign --force --verify --timestamp \
            --options runtime \
            --entitlements scripts/entitlements.plist \
            --sign "$CODESIGN_IDENTITY" \
            dist/drop2md/drop2md
          codesign --verify --deep --strict --verbose=2 dist/drop2md/drop2md

      # ── Package into .dmg ─────────────────────────────────────────────────
      - name: Create .dmg
        run: |
          STAGING=$(mktemp -d)
          cp -R dist/drop2md "$STAGING/drop2md"

          cat > "$STAGING/install.sh" << 'INSTALL_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DEST="${1:-/usr/local/bin}"
          mkdir -p "$DEST"
          cp "$(dirname "$0")/drop2md/drop2md" "$DEST/drop2md"
          chmod +x "$DEST/drop2md"
          echo "drop2md installed to $DEST/drop2md"
          echo "Run: drop2md setup"
          INSTALL_EOF
          chmod +x "$STAGING/install.sh"

          create-dmg \
            --volname "drop2md ${{ env.VERSION }}" \
            --window-pos 200 120 \
            --window-size 560 320 \
            --icon-size 96 \
            --no-internet-enable \
            "drop2md-${{ env.VERSION }}-arm64.dmg" \
            "$STAGING"

      - name: Sign .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          codesign --force --verify --timestamp \
            --sign "$CODESIGN_IDENTITY" \
            "drop2md-${{ env.VERSION }}-arm64.dmg"

      # ── Notarize ──────────────────────────────────────────────────────────
      # Required secrets:
      #   APPLE_ID                — your Apple ID email (e.g. docdyhr@me.com)
      #   APPLE_NOTARIZE_PASSWORD — app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID           — 10-char Team ID from developer.apple.com
      - name: Notarize
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "drop2md-${{ env.VERSION }}-arm64.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 600 2>&1 | tee notarize-output.txt
          # Save submission ID for the log fetch step
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' notarize-output.txt \
            | head -1 > submission-id.txt
          cat submission-id.txt
          # Fail if not accepted
          grep -q "status: Accepted" notarize-output.txt

      - name: Fetch Apple notarization log
        if: always()
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SUBMISSION_ID=$(cat submission-id.txt 2>/dev/null || echo "")
          if [ -n "$SUBMISSION_ID" ]; then
            echo "Fetching log for submission $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_NOTARIZE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" | tee notarization-log.json
          else
            echo "No submission ID found — skipping log fetch"
          fi

      - name: Upload notarization log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-log
          path: notarization-log.json
          if-no-files-found: ignore

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "drop2md-${{ env.VERSION }}-arm64.dmg"
          xcrun stapler validate "drop2md-${{ env.VERSION }}-arm64.dmg"

      # ── SHA-256 for Homebrew formula ──────────────────────────────────────
      - name: Compute SHA-256
        run: |
          SHA256=$(shasum -a 256 "drop2md-${{ env.VERSION }}-arm64.dmg" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A dispatch may rebuild an older tag: never mark that one Latest.
          make_latest: ${{ github.event_name == 'push' }}
          files: "drop2md-${{ env.VERSION }}-arm64.dmg"
          generate_release_notes: true
          body: |
            ## Installation

            **Homebrew (recommended):**
            ```bash
            brew tap docdyhr/tap
            brew install drop2md
            ```

            **Direct download:**
            1. Download `drop2md-${{ env.VERSION }}-arm64.dmg`
            2. Open the .dmg and run `./install.sh`  (or copy `drop2md/drop2md` to `/usr/local/bin/`)

            **After install:**
            ```bash
            drop2md setup        # interactive configuration wizard
            drop2md install-service   # install background watcher
            ```

            **Platform:** Apple Silicon (arm64, macOS ${{ env.MIN_MACOS }}+)
            **SHA-256:** `${{ env.SHA256 }}`

            > For Intel Macs or Linux: `pip install 'drop2md[pdf-light,office,ocr]'`

      - name: Post SHA-256 to job summary
        run: |
          # Homebrew names the oldest macOS the binary runs on
          case "${MIN_MACOS%%.*}" in
            11) OS_KEY=arm64_big_sur ;;
            12) OS_KEY=arm64_monterey ;;
            13) OS_KEY=arm64_ventura ;;
            14) OS_KEY=arm64_sonoma ;;
            15) OS_KEY=arm64_sequoia ;;
            26) OS_KEY=arm64_tahoe ;;
            *)  OS_KEY="arm64_UNKNOWN_macos_${MIN_MACOS}" ;;
          esac
          {
            echo "## Release Asset SHA-256"
            echo ""
            echo "Update \`Formula/drop2md.rb\` in \`docdyhr/homebrew-tap\` with:"
            echo '```ruby'
            echo "sha256 ${OS_KEY}: \"${{ env.SHA256 }}\""
            echo '```'
            echo ""
            echo "Minimum macOS for this build: ${{ env.MIN_MACOS }}"
          } >> "$GITHUB_STEP_SUMMARY"
